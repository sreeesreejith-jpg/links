<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sreejith Link | Useful Hub</title>
    <meta name="description"
        content="A curated portal for your most important web destinations. Quick, elegant, and organized.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons for premium feel -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <div class="background-animation"></div>

    <header>
        <div class="header-content">
            <h1 class="logo">Sreejith<span>Link</span></h1>
            <nav class="main-nav">
                <button id="navHome" class="nav-btn active"><i data-lucide="home"></i> Home</button>
                <button id="navAdd" class="nav-btn"><i data-lucide="plus-circle"></i> Add Link</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Page 1: Home/View Links -->
        <div id="homePage" class="page active">
            <div class="search-container">
                <i data-lucide="search"></i>
                <input type="text" id="linkSearch" placeholder="Search links, markets, utilities...">
            </div>

            <section class="category-filters">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="finance">Finance</button>
                <button class="filter-btn" data-category="utilities">Utilities</button>
                <button class="filter-btn" data-category="personal">Personal</button>
            </section>

            <div class="links-grid" id="linksGrid">
                <!-- Links will be dynamically injected here -->
            </div>
        </div>

        <!-- Page 2: Add Link -->
        <div id="addPage" class="page">
            <div class="form-container glass-card">
                <h2>Add New Resource</h2>
                <div class="input-group">
                    <label>Link Title</label>
                    <input type="text" id="linkTitle" placeholder="e.g. NIFTY 50">
                </div>
                <div class="input-group">
                    <label>URL Address</label>
                    <input type="url" id="linkUrl" placeholder="https://example.com">
                </div>
                <div class="input-group">
                    <label>Category</label>
                    <select id="linkCategory">
                        <option value="finance">Finance</option>
                        <option value="utilities">Utilities</option>
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                    </select>
                </div>
                <button id="saveBtn" class="primary-btn">
                    <i data-lucide="save"></i> Save Link
                </button>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Nexus Hub. All rights reserved.</p>
            <p>Built for efficiency & elegance.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
